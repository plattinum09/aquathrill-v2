<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลการชำระเงิน | AQUATHRILL</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <style>
        .booking-page{min-height:calc(100vh - 96px);display:flex;align-items:center}
        .booking-page .container{width:100%}
        .result-card{max-width:720px;min-height:420px;margin:0 auto;text-align:center;padding:56px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .result-card.loading{gap:18px;text-align:center!important}
        .result-icon{font-size:4rem;margin-bottom:20px}
        .result-card.loading .result-icon{position:relative;width:96px;height:96px;margin:0 0 10px;display:grid;place-items:center;border-radius:999px;background:rgba(255,193,7,.08);box-shadow:0 0 48px rgba(255,193,7,.18)}
        .result-card.loading .result-icon:before{content:"";position:absolute;inset:10px;border-radius:999px;border:3px solid rgba(255,193,7,.18);border-top-color:#ffc107;animation:spin 1s linear infinite}
        .result-card.loading .result-icon i{font-size:2.4rem;animation:none}
        @keyframes spin{to{transform:rotate(360deg)}}
        .result-icon.success{color:#00c853}
        .result-icon.pending{color:#ffc107}
        .result-icon.failed{color:#ff5252}
        .result-title{width:100%;align-self:center!important;text-align:center!important;justify-content:center!important;font-size:1.8rem;margin:0 auto 10px!important;font-weight:800}
        .result-desc{width:100%;align-self:center!important;text-align:center!important;color:rgba(255,255,255,.66);font-size:1rem;margin:0 auto 24px!important;line-height:1.6}
        .result-details{width:min(620px,100%);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:24px 28px;text-align:left;margin:0 auto 28px}
        .result-details .detail-row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(220px,1.35fr);gap:24px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
        .result-details .detail-row:last-child{border-bottom:none}
        .result-details .label{color:rgba(255,255,255,.78)!important;font-size:.85rem}
        .result-details .value{color:#fff!important;font-weight:700;font-size:.9rem;text-align:right;word-break:break-word}
        .result-details .value.amount{color:#00d4ff!important}
        .result-details .value.status-success{color:#00c853!important}
        .result-details .value.status-pending{color:#ffc107!important}
        .result-details .value.status-failed{color:#ff5252!important}
        .next-steps{width:min(620px,100%);margin:0 auto 28px;padding:18px 20px;border-radius:18px;background:rgba(0,212,255,.07);border:1px solid rgba(0,212,255,.16);text-align:left}
        .next-steps h3{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:#fff;font-size:1rem}
        .next-steps h3 i{color:#00d4ff}
        .next-steps ul{display:grid;gap:10px;margin:0;padding:0;list-style:none}
        .next-steps li{display:flex;gap:10px;color:rgba(255,255,255,.72);font-size:.9rem;line-height:1.45}
        .next-steps li i{color:#00c853;margin-top:3px}
        @media (max-width:560px){.result-details{padding:20px}.result-details .detail-row{grid-template-columns:1fr;gap:4px}.result-details .value{text-align:left}}
        .btn-back{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:linear-gradient(135deg,#00b4ff,#0066cc);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;text-decoration:none;transition:.3s}
        .btn-back:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,100,255,.3)}
        .btn-whatsapp{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:#25D366;color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;text-decoration:none;transition:.3s;margin-left:8px}
        .btn-whatsapp:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,211,102,.3)}
    </style>
</head>
<body>
    <div id="site-header"></div>

    <main class="booking-page">
        <div class="container">
            <div class="booking-card result-card loading" id="result-card">
                <div class="result-icon pending">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>
                <h2 class="result-title">กำลังตรวจสอบ...</h2>
                <p class="result-desc">กรุณารอสักครู่ ระบบกำลังตรวจสอบสถานะการชำระเงิน</p>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="../../assets/js/i18n-core.js?v=20260724a"></script>
    <script src="../../assets/js/i18n-loader.js?v=20260724a" defer></script>
    <script src="../../assets/js/components.js?v=20260724a"></script>
    <script src="../../assets/js/main.js?v=20260724a"></script>
    <script>
    (async function() {
        const params = new URLSearchParams(window.location.search);
        const bookingId = params.get('booking_id');
        const lang = (function(){
            const value = (params.get('lang') || localStorage.getItem('preferredLanguage') || localStorage.getItem('language') || 'th').toLowerCase();
            return ['th','en','ru','zh'].includes(value) ? value : 'th';
        })();
        localStorage.setItem('preferredLanguage', lang);
        document.documentElement.lang = lang;
        const L = {
            th: {
                title: 'ผลการชำระเงิน | AQUATHRILL', checkingTitle: 'กำลังตรวจสอบ...', checkingDesc: 'กรุณารอสักครู่ ระบบกำลังตรวจสอบสถานะการชำระเงิน',
                missingTitle: 'ไม่พบข้อมูลการจอง', missingDesc: 'ไม่พบหมายเลขการจอง กรุณาลองใหม่อีกครั้ง', notFoundTitle: 'ไม่พบการจอง', notFoundDesc: 'ไม่พบข้อมูลการจองหมายเลข ',
                successTitle: 'ชำระเงินสำเร็จ!', successDesc: 'ขอบคุณที่ใช้บริการ AQUATHRILL การจองของคุณได้รับการยืนยันแล้ว',
                failedTitle: 'การชำระเงินล้มเหลว', failedDesc: 'การชำระเงินไม่สำเร็จ กรุณาลองใหม่อีกครั้งหรือเลือกช่องทางชำระเงินอื่น',
                pendingTitle: 'รอการยืนยัน', pendingDesc: 'การชำระเงินกำลังดำเนินการตรวจสอบ ระบบจะอัปเดตสถานะโดยอัตโนมัติ',
                errorTitle: 'เกิดข้อผิดพลาด', errorDesc: 'ไม่สามารถตรวจสอบสถานะได้ กรุณาติดต่อเรา',
                bookingNo: 'หมายเลขการจอง', boatType: 'ประเภทเรือ', date: 'วันที่', time: 'เวลา', amount: 'ยอดชำระ', status: 'สถานะ',
                morning: 'รอบเช้า', afternoon: 'รอบบ่าย', confirmed: 'ชำระเงินสำเร็จ', pending: 'รอตรวจสอบ', failed: 'ล้มเหลว',
                nextTitle: 'ขั้นตอนถัดไป', next1: 'ทีมงานจะตรวจสอบรายละเอียดและติดต่อยืนยันผ่าน WhatsApp/โทรศัพท์', next2: 'กรุณาเตรียมเอกสารหรือบัตรประจำตัวสำหรับวันเดินทาง', next3: 'เวลารับจากโรงแรมและรายละเอียดทริปจะแจ้งให้ทราบก่อนออกเดินทาง',
                home: 'กลับหน้าหลัก', contact: 'ติดต่อเรา', baht: ' บาท'
            },
            en: {
                title: 'Payment Result | AQUATHRILL', checkingTitle: 'Checking...', checkingDesc: 'Please wait while we check your payment status.',
                missingTitle: 'Booking not found', missingDesc: 'Missing booking number. Please try again.', notFoundTitle: 'Booking not found', notFoundDesc: 'No booking found for ',
                successTitle: 'Payment successful!', successDesc: 'Thank you for booking with AQUATHRILL. Your booking has been confirmed.',
                failedTitle: 'Payment failed', failedDesc: 'The payment was not completed. Please try again or choose another payment method.',
                pendingTitle: 'Waiting for confirmation', pendingDesc: 'Your payment is being checked. The system will update the status automatically.',
                errorTitle: 'Something went wrong', errorDesc: 'Could not check the payment status. Please contact us.',
                bookingNo: 'Booking number', boatType: 'Boat type', date: 'Date', time: 'Time', amount: 'Amount', status: 'Status',
                morning: 'Morning', afternoon: 'Afternoon', confirmed: 'Payment successful', pending: 'Pending review', failed: 'Failed',
                nextTitle: 'Next steps', next1: 'Our team will review the details and confirm via WhatsApp/phone.', next2: 'Please prepare your ID or required documents for the trip date.', next3: 'Hotel pickup time and trip details will be sent before departure.',
                home: 'Back home', contact: 'Contact us', baht: ' THB'
            },
            ru: {
                title: 'Результат оплаты | AQUATHRILL', checkingTitle: 'Проверяем...', checkingDesc: 'Пожалуйста, подождите, мы проверяем статус оплаты.',
                missingTitle: 'Бронирование не найдено', missingDesc: 'Номер бронирования отсутствует. Попробуйте еще раз.', notFoundTitle: 'Бронирование не найдено', notFoundDesc: 'Нет данных по бронированию ',
                successTitle: 'Оплата успешна!', successDesc: 'Спасибо за бронирование в AQUATHRILL. Ваше бронирование подтверждено.',
                failedTitle: 'Оплата не прошла', failedDesc: 'Платеж не был завершен. Попробуйте еще раз или выберите другой способ оплаты.',
                pendingTitle: 'Ожидает подтверждения', pendingDesc: 'Оплата проверяется. Статус обновится автоматически.',
                errorTitle: 'Произошла ошибка', errorDesc: 'Не удалось проверить статус оплаты. Пожалуйста, свяжитесь с нами.',
                bookingNo: 'Номер бронирования', boatType: 'Тип лодки', date: 'Дата', time: 'Время', amount: 'Сумма', status: 'Статус',
                morning: 'Утро', afternoon: 'День', confirmed: 'Оплата успешна', pending: 'На проверке', failed: 'Неудачно',
                nextTitle: 'Следующие шаги', next1: 'Наша команда проверит детали и подтвердит через WhatsApp/телефон.', next2: 'Пожалуйста, подготовьте документы или удостоверение личности на день поездки.', next3: 'Время трансфера из отеля и детали тура будут отправлены перед выездом.',
                home: 'На главную', contact: 'Связаться', baht: ' THB'
            },
            zh: {
                title: '付款结果 | AQUATHRILL', checkingTitle: '正在检查...', checkingDesc: '请稍等，系统正在检查付款状态。',
                missingTitle: '找不到预订信息', missingDesc: '缺少预订编号，请重试。', notFoundTitle: '找不到预订', notFoundDesc: '找不到此预订编号：',
                successTitle: '付款成功！', successDesc: '感谢您预订 AQUATHRILL，您的预订已确认。',
                failedTitle: '付款失败', failedDesc: '付款未完成，请重新尝试或选择其他付款方式。',
                pendingTitle: '等待确认', pendingDesc: '付款正在检查中，系统会自动更新状态。',
                errorTitle: '发生错误', errorDesc: '无法检查付款状态，请联系我们。',
                bookingNo: '预订编号', boatType: '船型', date: '日期', time: '时间', amount: '付款金额', status: '状态',
                morning: '上午', afternoon: '下午', confirmed: '付款成功', pending: '等待审核', failed: '失败',
                nextTitle: '下一步', next1: '我们的团队会检查详情，并通过 WhatsApp/电话确认。', next2: '请在出行当天准备身份证件或相关文件。', next3: '酒店接送时间和行程详情会在出发前通知。',
                home: '返回首页', contact: '联系我们', baht: ' THB'
            }
        }[lang];
        document.title = L.title;
        const card = document.getElementById('result-card');
        card.querySelector('.result-title').textContent = L.checkingTitle;
        card.querySelector('.result-desc').textContent = L.checkingDesc;

        if (!bookingId) {
            showResult('failed', 'fa-exclamation-circle', L.missingTitle, L.missingDesc);
            return;
        }

        try {
            let booking = null;
            for (let attempt = 0; attempt < 5; attempt++) {
                if (attempt > 0) await new Promise(r => setTimeout(r, 1800));
                await fetch('/api/omise-sync-status.php?booking_id=' + encodeURIComponent(bookingId), { credentials: 'include', cache: 'no-store' }).catch(function(){});
                const r = await fetch('/api/bookings.php?search=' + bookingId + '&limit=1', { credentials: 'include', cache: 'no-store' });
                const d = await r.json();
                const bookings = d.bookings || [];
                booking = bookings.find(b => b.booking_id === bookingId) || null;
                if (!booking || booking.status === 'confirmed' || booking.status === 'cancelled') break;
            }

            if (!booking) {
                showResult('failed', 'fa-exclamation-circle', L.notFoundTitle, L.notFoundDesc + bookingId);
                return;
            }

            if (booking.status === 'confirmed') {
                showResult('success', 'fa-check-circle', L.successTitle, L.successDesc, booking);
            } else if (booking.status === 'cancelled') {
                showResult('failed', 'fa-times-circle', L.failedTitle, L.failedDesc, booking);
            } else {
                // pending — could be callback hasn't arrived yet
                showResult('pending', 'fa-clock', L.pendingTitle, L.pendingDesc, booking);
            }
        } catch(e) {
            showResult('failed', 'fa-exclamation-triangle', L.errorTitle, L.errorDesc);
        }

        function showResult(type, icon, title, desc, booking) {
            card.classList.remove('loading');
            const fmtPrice = (n) => {
                const s = '฿' + Number(n || 0).toLocaleString('th-TH');
                return s + L.baht;
            };
            const fmtDate = (value) => {
                if (!value) return '-';
                const date = new Date(value);
                if (Number.isNaN(date.getTime())) return value;
                const locale = { th: 'th-TH', en: 'en-GB', ru: 'ru-RU', zh: 'zh-CN' }[lang] || 'en-GB';
                return date.toLocaleDateString(locale, { year: 'numeric', month: 'long', day: 'numeric' });
            };
            const fmtSlot = (value) => ({
                morning: L.morning,
                afternoon: L.afternoon
            }[value] || value || '-');
            let html = `
                <div class="result-icon ${type}">
                    <i class="fas ${icon}"></i>
                </div>
                <h2 class="result-title">${title}</h2>
                <p class="result-desc">${desc}</p>`;

            if (booking) {
                html += `
                <div class="result-details">
                    <div class="detail-row">
                        <span class="label">${L.bookingNo}</span>
                        <span class="value">${booking.booking_id || '-'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">${L.boatType}</span>
                        <span class="value">${booking.boat_type || '-'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">${L.date}</span>
                        <span class="value">${fmtDate(booking.booking_date)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">${L.time}</span>
                        <span class="value">${fmtSlot(booking.time_slot)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">${L.amount}</span>
                        <span class="value amount">${fmtPrice(booking.total_price)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">${L.status}</span>
                        <span class="value ${type === 'success' ? 'status-success' : type === 'pending' ? 'status-pending' : 'status-failed'}">
                            ${booking.status === 'confirmed' ? L.confirmed : booking.status === 'pending' ? L.pending : L.failed}
                        </span>
                    </div>
                </div>`;
                if (type === 'success') {
                    html += `
                <div class="next-steps">
                    <h3><i class="fas fa-list-check"></i> ${L.nextTitle}</h3>
                    <ul>
                        <li><i class="fas fa-check-circle"></i><span>${L.next1}</span></li>
                        <li><i class="fas fa-check-circle"></i><span>${L.next2}</span></li>
                        <li><i class="fas fa-check-circle"></i><span>${L.next3}</span></li>
                    </ul>
                </div>`;
                }
            }

            html += `
                <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
                    <a href="/" class="btn-back"><i class="fas fa-home"></i> ${L.home}</a>
                    <a href="https://wa.me/66958192778" target="_blank" class="btn-whatsapp"><i class="fab fa-whatsapp"></i> ${L.contact}</a>
                </div>`;

            card.innerHTML = html;
        }
    })();
    </script>
</body>
</html>
