<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>จัดการ One Day Trip | AQUATHRILL Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#0a1628;color:#f5fbff;font-family:Kanit,sans-serif}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.side{background:#101f34;border-right:1px solid #294258;padding:26px 18px}.brand{font-size:1.45rem;font-weight:800;color:#00d4ff;margin-bottom:28px}.side a{display:block;color:#b6c7d5;text-decoration:none;padding:11px 12px;border-radius:5px}.side a:hover,.side a.active{color:white;background:#174960}.main{padding:30px;max-width:1200px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.top h1{font-size:1.7rem;margin:0}.button{font:inherit;border:0;border-radius:5px;padding:10px 16px;cursor:pointer;font-weight:700;background:#00a5bc;color:#fff}.button:hover{background:#087f91}.button.secondary{background:#29435c}.button.danger{background:#953e4a}.button:disabled{opacity:.5;cursor:wait}.columns{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}.panel{background:#11263d;border:1px solid #31506a;border-radius:7px;padding:20px}.list{display:grid;gap:7px;margin:14px 0}.item{width:100%;text-align:left;background:#1b3854;border:1px solid transparent;color:#fff;font:inherit;border-radius:5px;padding:10px;cursor:pointer}.item.active{border-color:#00d4ff;background:#205172}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:5px;margin-bottom:15px}.field label{font-size:.9rem;color:#c9d8e3}.field input,.field textarea{width:100%;border:1px solid #43647c;border-radius:4px;background:#0c1e30;color:white;padding:11px;font:inherit}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field textarea:focus{outline:2px solid #00b9d4}.tabs{display:flex;gap:6px;margin-bottom:20px}.tabs button{background:#1b3854;color:#b9ccda;border:0;border-radius:4px;padding:7px 16px;font:inherit;cursor:pointer}.tabs button.active{background:#00a5bc;color:white}.images{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.image-tile{position:relative}.image-tile img{width:100%;height:110px;object-fit:cover;border-radius:4px}.image-tile button{position:absolute;right:4px;top:4px;background:#9a303e;color:white;border:0;border-radius:4px;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.notice{min-height:25px;color:#80e4c5}.login{max-width:390px;margin:15vh auto;background:#11263d;border:1px solid #31506a;padding:30px;border-radius:7px}.login h1{font-size:1.5rem}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:flex;gap:8px;overflow:auto;padding:10px}.brand{display:none}.side a{white-space:nowrap}.main{padding:18px}.columns{grid-template-columns:1fr}}@media(max-width:560px){.form-grid{grid-template-columns:1fr}.images{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="login" class="login hidden"><h1>เข้าสู่ระบบหลังบ้าน</h1><form id="login-form"><div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="button" type="submit">เข้าสู่ระบบ</button></form><p id="login-error" role="alert"></p></div>
<div id="app" class="layout hidden"><aside class="side"><div class="brand">AQUATHRILL</div><a href="/admin">Dashboard</a><a href="/admin/bookings">การจอง</a><a href="/admin/promotions">โปรโมชั่น</a><a href="/admin/one-day-trip" class="active">One Day Trip</a><a href="/one-day-trip" target="_blank" rel="noopener">ดูหน้าบ้าน ↗</a></aside><main class="main"><div class="top"><h1>จัดการ One Day Trip</h1><button id="add" class="button" type="button"><i class="fas fa-plus"></i> เพิ่มสถานที่</button></div><div class="columns"><section class="panel"><strong>สถานที่ท่องเที่ยว</strong><div id="items" class="list"></div></section><section class="panel"><form id="editor" class="hidden"><div class="form-grid"><div class="field"><label for="place-id">รหัส URL</label><input id="place-id" pattern="[a-z0-9-]+" maxlength="60" required></div><div class="field"><label for="sort-order">ลำดับ</label><input id="sort-order" type="number" min="0" value="0"></div></div><div class="tabs" id="languages"><button type="button" data-lang="th" class="active">TH</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="zh">ZH</button></div><div class="field"><label for="name">ชื่อสถานที่</label><input id="name"></div><div class="field"><label for="summary">คำอธิบายบนการ์ด</label><textarea id="summary"></textarea></div><div class="field"><label for="description">รายละเอียดสถานที่</label><textarea id="description" rows="5"></textarea></div><div class="field"><label for="highlights">จุดเด่น (บรรทัดละข้อ)</label><textarea id="highlights"></textarea></div><strong>ภาพสถานที่</strong><div id="images" class="images"></div><div class="field"><label for="image-upload">เพิ่มภาพ (ภาพแรกเป็นภาพปก)</label><input id="image-upload" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple></div><div class="actions"><button id="save" class="button" type="submit"><i class="fas fa-save"></i> บันทึก</button><button id="remove" class="button danger" type="button"><i class="fas fa-trash"></i> ลบสถานที่</button></div><p id="notice" class="notice" role="status"></p></form><p id="select-hint">เลือกสถานที่ทางซ้าย หรือกดเพิ่มสถานที่</p></section></div></main></div>
<script src="/assets/js/i18n-core.js"></script><script src="/assets/js/one-day-trip.js"></script><script>
(function(){
const defaults=window.OneDayTripDefaults||[];let items=[];let index=-1;let language='th';let draft=null;
const $=id=>document.getElementById(id);
async function request(url,options){const response=await fetch(url,{credentials:'include',...options});const data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed');return data}
function message(value,error=false){$('notice').textContent=value;$('notice').style.color=error?'#ff9ca8':'#80e4c5'}
function fieldsToDraft(){if(!draft)return;draft.id=$('place-id').value.trim();draft.sort_order=Number($('sort-order').value)||0;draft.names=draft.names||{};draft.summary=draft.summary||{};draft.description=draft.description||{};draft.highlights=draft.highlights||{};draft.names[language]=$('name').value.trim();draft.summary[language]=$('summary').value.trim();draft.description[language]=$('description').value.trim();draft.highlights[language]=$('highlights').value.split('\n').map(x=>x.trim()).filter(Boolean)}
function showLanguage(){document.querySelectorAll('#languages button').forEach(b=>b.classList.toggle('active',b.dataset.lang===language));$('name').value=draft.names?.[language]||'';$('summary').value=draft.summary?.[language]||'';$('description').value=draft.description?.[language]||'';$('highlights').value=(draft.highlights?.[language]||[]).join('\n')}
function renderImages(){const box=$('images');box.replaceChildren();(draft.images||[]).forEach((url,i)=>{const tile=document.createElement('div');tile.className='image-tile';const img=document.createElement('img');img.src=url;img.alt='ภาพ '+(i+1);const button=document.createElement('button');button.type='button';button.textContent='×';button.setAttribute('aria-label','ลบภาพ '+(i+1));button.onclick=()=>{draft.images.splice(i,1);renderImages()};tile.append(img,button);box.append(tile)})}
function renderList(){const box=$('items');box.replaceChildren();items.forEach((item,i)=>{const button=document.createElement('button');button.className='item'+(i===index?' active':'');button.textContent=(item.names?.th||item.names?.en||item.id||'สถานที่ใหม่');button.onclick=()=>select(i);box.append(button)})}
function select(i){if(index>=0&&draft)fieldsToDraft();if(index>=0&&draft)items[index]=draft;index=i;draft=structuredClone(items[i]);$('editor').classList.remove('hidden');$('select-hint').classList.add('hidden');$('place-id').value=draft.id||'';$('sort-order').value=draft.sort_order||0;showLanguage();renderImages();renderList();message('')}
async function save(){fieldsToDraft();if(!/^[a-z0-9-]{2,60}$/.test(draft.id)){message('รหัส URL ต้องเป็น a-z, 0-9 หรือ - อย่างน้อย 2 ตัว',true);return}if(items.some((item,i)=>i!==index&&item.id===draft.id)){message('รหัส URL ซ้ำ',true);return}if(!draft.names?.th&&!draft.names?.en){message('กรุณากรอกชื่อสถานที่',true);return}items[index]=draft;items.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));$('save').disabled=true;try{await request('/api/page-content.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'one-day-trip',content:{destinations:items}})});index=items.findIndex(item=>item.id===draft.id);renderList();message('บันทึกเรียบร้อยแล้ว')}catch(e){message(e.message,true)}finally{$('save').disabled=false}}
async function init(){try{const auth=await request('/api/admin-auth.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'check'})});if(!auth.authenticated){$('login').classList.remove('hidden');return}$('app').classList.remove('hidden');const data=await request('/api/page-content.php?page=one-day-trip&admin=1');items=Array.isArray(data.content?.destinations)?data.content.destinations:structuredClone(defaults);renderList();if(items.length)select(0)}catch(e){$('login').classList.remove('hidden');$('login-error').textContent=e.message}}
$('login-form').onsubmit=async e=>{e.preventDefault();try{await request('/api/admin-auth.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:$('username').value,password:$('password').value})});$('login').classList.add('hidden');init()}catch(error){$('login-error').textContent=error.message}};
$('languages').onclick=e=>{const button=e.target.closest('button[data-lang]');if(!button)return;fieldsToDraft();language=button.dataset.lang;showLanguage()};
$('add').onclick=()=>{if(index>=0&&draft){fieldsToDraft();items[index]=draft}items.push({id:'new-place-'+Date.now(),sort_order:items.length,names:{},summary:{},description:{},highlights:{},images:[]});select(items.length-1);$('place-id').focus()};
$('remove').onclick=async()=>{if(index<0||!confirm('ลบสถานที่นี้?'))return;const previous=items.slice();items.splice(index,1);try{await request('/api/page-content.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'one-day-trip',content:{destinations:items}})});index=-1;draft=null;$('editor').classList.add('hidden');$('select-hint').classList.remove('hidden');renderList();if(items.length)select(0)}catch(e){items=previous;message(e.message,true)}};
$('editor').onsubmit=e=>{e.preventDefault();save()};
$('image-upload').onchange=async e=>{const files=Array.from(e.target.files);for(const file of files){const form=new FormData();form.append('image',file);try{const data=await request('/api/upload.php',{method:'POST',body:form});draft.images.push(data.url);renderImages();message('อัปโหลดภาพแล้ว กรุณากดบันทึก')}catch(error){message(error.message,true)}}e.target.value=''};
init();
})();
</script></body></html>
